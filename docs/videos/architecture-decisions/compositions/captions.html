<div id="root" data-composition-id="captions" data-width="1920" data-height="1080" data-layout-allow-overflow>
<div id="h1c0" class="cap clip" data-start="0.3" data-duration="1.579" data-track-index="1"><span>A student returns a laptop.</span></div>
<div id="h2c0" class="cap clip" data-start="2.099" data-duration="1.415" data-track-index="1"><span>The system must record it,</span></div>
<div id="h2c1" class="cap clip" data-start="3.514" data-duration="1.678" data-track-index="1"><span>and a notification must go out.</span></div>
<div id="h3c0" class="cap clip" data-start="5.412" data-duration="1.493" data-track-index="1"><span>What if something crashes halfway?</span></div>
<div id="h4c0" class="cap clip" data-start="7.125" data-duration="1.458" data-track-index="1"><span>This design has two goals:</span></div>
<div id="h4c1" class="cap clip" data-start="8.583" data-duration="2.105" data-track-index="1"><span>run on Azure without managing servers,</span></div>
<div id="h5c0" class="cap clip" data-start="10.908" data-duration="1.897" data-track-index="1"><span>and stay correct when requests overlap</span></div>
<div id="h5c1" class="cap clip" data-start="12.805" data-duration="0.876" data-track-index="1"><span>or services fail.</span></div>
<div id="h6c0" class="cap clip" data-start="13.901" data-duration="1.515" data-track-index="1"><span>Follow one return through it.</span></div>
<div id="i1c0" class="cap clip" data-start="15.966" data-duration="1.621" data-track-index="1"><span>First, the way in: ingress.</span></div>
<div id="i4c0" class="cap clip" data-start="17.807" data-duration="2.066" data-track-index="1"><span>Nginx and Let's Encrypt were the</span></div>
<div id="i4c1" class="cap clip" data-start="19.873" data-duration="2.629" data-track-index="1"><span>original plan, but Container Apps already</span></div>
<div id="i4c2" class="cap clip" data-start="22.502" data-duration="1.69" data-track-index="1"><span>handles HTTPS and routing,</span></div>
<div id="i4c3" class="cap clip" data-start="24.192" data-duration="1.189" data-track-index="1"><span>so they disappear.</span></div>
<div id="i5c0" class="cap clip" data-start="25.601" data-duration="2.716" data-track-index="1"><span>Authorization stays: the API still validates</span></div>
<div id="i5c1" class="cap clip" data-start="28.317" data-duration="2.233" data-track-index="1"><span>Auth0 tokens and checks permissions.</span></div>
<div id="i6c0" class="cap clip" data-start="30.77" data-duration="1.021" data-track-index="1"><span>The cost: relying on</span></div>
<div id="i6c1" class="cap clip" data-start="31.791" data-duration="1.411" data-track-index="1"><span>Azure's features and limits.</span></div>
<div id="a1c0" class="cap clip" data-start="33.752" data-duration="1.924" data-track-index="1"><span>Behind ingress: a Rust API and</span></div>
<div id="a1c1" class="cap clip" data-start="35.676" data-duration="1.427" data-track-index="1"><span>a notification worker,</span></div>
<div id="a1c2" class="cap clip" data-start="37.104" data-duration="1.427" data-track-index="1"><span>both container images.</span></div>
<div id="a2c0" class="cap clip" data-start="38.751" data-duration="1.291" data-track-index="1"><span>Azure starts, restarts,</span></div>
<div id="a2c1" class="cap clip" data-start="40.041" data-duration="1.291" data-track-index="1"><span>routes and scales them:</span></div>
<div id="a3c0" class="cap clip" data-start="41.552" data-duration="1.728" data-track-index="1"><span>the API by HTTP demand,</span></div>
<div id="a3c1" class="cap clip" data-start="43.28" data-duration="2.304" data-track-index="1"><span>Notifications by queue backlog.</span></div>
<div id="a4c0" class="cap clip" data-start="45.804" data-duration="1.401" data-track-index="1"><span>Functions could also work,</span></div>
<div id="a4c1" class="cap clip" data-start="47.205" data-duration="1.765" data-track-index="1"><span>with a different execution model;</span></div>
<div id="a4c2" class="cap clip" data-start="48.97" data-duration="1.869" data-track-index="1"><span>this keeps an ordinary Axum server.</span></div>
<div id="a6c0" class="cap clip" data-start="51.059" data-duration="1.523" data-track-index="1"><span>It even absorbed the switch from</span></div>
<div id="a6c1" class="cap clip" data-start="52.582" data-duration="0.738" data-track-index="1"><span>Python to Rust.</span></div>
<div id="a7c0" class="cap clip" data-start="53.54" data-duration="1.934" data-track-index="1"><span>The cost: you still maintain images</span></div>
<div id="a7c1" class="cap clip" data-start="55.474" data-duration="1.021" data-track-index="1"><span>and scaling rules,</span></div>
<div id="a7c2" class="cap clip" data-start="56.495" data-duration="1.72" data-track-index="1"><span>and scaling from zero can delay</span></div>
<div id="a7c3" class="cap clip" data-start="58.215" data-duration="1.021" data-track-index="1"><span>the first request.</span></div>
<div id="o1c0" class="cap clip" data-start="59.786" data-duration="0.975" data-track-index="1"><span>Now the hard part:</span></div>
<div id="o1c1" class="cap clip" data-start="60.761" data-duration="1.078" data-track-index="1"><span>update the database,</span></div>
<div id="o1c2" class="cap clip" data-start="61.839" data-duration="1.232" data-track-index="1"><span>then message the queue.</span></div>
<div id="o2c0" class="cap clip" data-start="63.291" data-duration="0.922" data-track-index="1"><span>Crash in between,</span></div>
<div id="o2c1" class="cap clip" data-start="64.213" data-duration="1.536" data-track-index="1"><span>and the return exists but the</span></div>
<div id="o2c2" class="cap clip" data-start="65.749" data-duration="1.126" data-track-index="1"><span>notification is lost.</span></div>
<div id="o3c0" class="cap clip" data-start="67.095" data-duration="1.87" data-track-index="1"><span>Reverse them, and a notification can</span></div>
<div id="o3c1" class="cap clip" data-start="68.965" data-duration="1.416" data-track-index="1"><span>go out for a failed update.</span></div>
<div id="o4c0" class="cap clip" data-start="70.601" data-duration="1.824" data-track-index="1"><span>So the outbox saves the change</span></div>
<div id="o4c1" class="cap clip" data-start="72.425" data-duration="1.706" data-track-index="1"><span>and the notification request</span></div>
<div id="o4c2" class="cap clip" data-start="74.131" data-duration="1.824" data-track-index="1"><span>in one PostgreSQL transaction.</span></div>
<div id="o5c0" class="cap clip" data-start="76.175" data-duration="1.152" data-track-index="1"><span>Commit both, or neither.</span></div>
<div id="o6c0" class="cap clip" data-start="77.547" data-duration="1.899" data-track-index="1"><span>Loans keep working through a queue outage.</span></div>
<div id="o7c0" class="cap clip" data-start="79.666" data-duration="1.473" data-track-index="1"><span>The cost: extra processing,</span></div>
<div id="o7c1" class="cap clip" data-start="81.139" data-duration="1.684" data-track-index="1"><span>storage, and eventual delivery.</span></div>
<div id="p1c0" class="cap clip" data-start="83.373" data-duration="2.566" data-track-index="1"><span>The application decides what succeeds together,</span></div>
<div id="p1c1" class="cap clip" data-start="85.939" data-duration="1.443" data-track-index="1"><span>through a small interface:</span></div>
<div id="p1c2" class="cap clip" data-start="87.382" data-duration="1.069" data-track-index="1"><span>a transaction port.</span></div>
<div id="p2c0" class="cap clip" data-start="88.671" data-duration="1.813" data-track-index="1"><span>Lock, apply the rule, save, commit.</span></div>
<div id="p3c0" class="cap clip" data-start="90.704" data-duration="2.261" data-track-index="1"><span>The PostgreSQL adapter implements how.</span></div>
<div id="p4c0" class="cap clip" data-start="93.185" data-duration="1.899" data-track-index="1"><span>That keeps rules testable with fake</span></div>
<div id="p4c1" class="cap clip" data-start="95.084" data-duration="1.582" data-track-index="1"><span>adapters, at the cost of more</span></div>
<div id="p4c2" class="cap clip" data-start="96.666" data-duration="1.213" data-track-index="1"><span>interfaces and wiring.</span></div>
<div id="p6c0" class="cap clip" data-start="98.099" data-duration="2.105" data-track-index="1"><span>But fakes can't prove real concurrency,</span></div>
<div id="p6c1" class="cap clip" data-start="100.204" data-duration="1.948" data-track-index="1"><span>so integration tests stay necessary.</span></div>
<div id="b1c0" class="cap clip" data-start="102.702" data-duration="2.731" data-track-index="1"><span>PostgreSQL won't publish that record by itself.</span></div>
<div id="b2c0" class="cap clip" data-start="105.653" data-duration="1.869" data-track-index="1"><span>So a scheduled Container Apps Job</span></div>
<div id="b2c1" class="cap clip" data-start="107.522" data-duration="1.704" data-track-index="1"><span>wakes, claims a bounded batch,</span></div>
<div id="b2c2" class="cap clip" data-start="109.226" data-duration="2.144" data-track-index="1"><span>publishes, records success, and exits.</span></div>
<div id="b3c0" class="cap clip" data-start="111.59" data-duration="1.411" data-track-index="1"><span>It runs even when the API</span></div>
<div id="b3c1" class="cap clip" data-start="113.001" data-duration="1.085" data-track-index="1"><span>has scaled to zero.</span></div>
<div id="b4c0" class="cap clip" data-start="114.306" data-duration="1.86" data-track-index="1"><span>The one-minute schedule adds delay,</span></div>
<div id="b4c1" class="cap clip" data-start="116.166" data-duration="1.447" data-track-index="1"><span>and runs even with no work.</span></div>
<div id="v1c0" class="cap clip" data-start="118.163" data-duration="1.741" data-track-index="1"><span>Service Bus buffers the request,</span></div>
<div id="v1c1" class="cap clip" data-start="119.904" data-duration="1.952" data-track-index="1"><span>so Loan and Notifications needn't be</span></div>
<div id="v1c2" class="cap clip" data-start="121.855" data-duration="1.108" data-track-index="1"><span>up at the same time.</span></div>
<div id="v2c0" class="cap clip" data-start="123.183" data-duration="2.304" data-track-index="1"><span>Every responsibility gets a managed home.</span></div>
<div id="v3c0" class="cap clip" data-start="125.707" data-duration="1.968" data-track-index="1"><span>PostgreSQL for loan state.</span></div>
<div id="v3c1" class="cap clip" data-start="127.675" data-duration="2.405" data-track-index="1"><span>Cosmos DB for notification jobs.</span></div>
<div id="v4c0" class="cap clip" data-start="130.3" data-duration="1.341" data-track-index="1"><span>A registry for images.</span></div>
<div id="v4c1" class="cap clip" data-start="131.641" data-duration="2.158" data-track-index="1"><span>Identities and Key Vault for access.</span></div>
<div id="v5c0" class="cap clip" data-start="134.019" data-duration="1.242" data-track-index="1"><span>Monitor for failures.</span></div>
<div id="v5c1" class="cap clip" data-start="135.261" data-duration="1.638" data-track-index="1"><span>Storage for Terraform state.</span></div>
<div id="v7c0" class="cap clip" data-start="137.119" data-duration="1.733" data-track-index="1"><span>Each adds cost or complexity,</span></div>
<div id="v7c1" class="cap clip" data-start="138.852" data-duration="1.444" data-track-index="1"><span>and Cosmos was a choice,</span></div>
<div id="v7c2" class="cap clip" data-start="140.297" data-duration="0.982" data-track-index="1"><span>not a necessity.</span></div>
<div id="d1c0" class="cap clip" data-start="141.829" data-duration="1.536" data-track-index="1"><span>Now accept that retries happen.</span></div>
<div id="d2c0" class="cap clip" data-start="143.585" data-duration="1.609" data-track-index="1"><span>Service Bus accepts a message,</span></div>
<div id="d2c1" class="cap clip" data-start="145.194" data-duration="1.505" data-track-index="1"><span>the publisher crashes before</span></div>
<div id="d2c2" class="cap clip" data-start="146.7" data-duration="1.557" data-track-index="1"><span>recording that, then retries.</span></div>
<div id="d3c0" class="cap clip" data-start="148.477" data-duration="1.493" data-track-index="1"><span>Two messages, one request.</span></div>
<div id="d4c0" class="cap clip" data-start="150.19" data-duration="2.318" data-track-index="1"><span>A stable event ID lets Notifications</span></div>
<div id="d4c1" class="cap clip" data-start="152.508" data-duration="2.13" data-track-index="1"><span>check the existing job instead of</span></div>
<div id="d4c2" class="cap clip" data-start="154.637" data-duration="1.441" data-track-index="1"><span>blindly sending again.</span></div>
<div id="l1c0" class="cap clip" data-start="156.628" data-duration="1.566" data-track-index="1"><span>And two workers could still hold</span></div>
<div id="l1c1" class="cap clip" data-start="158.194" data-duration="0.759" data-track-index="1"><span>copies at once.</span></div>
<div id="l2c0" class="cap clip" data-start="159.173" data-duration="1.943" data-track-index="1"><span>A lease records temporary ownership:</span></div>
<div id="l2c1" class="cap clip" data-start="161.115" data-duration="1.155" data-track-index="1"><span>this job, this owner,</span></div>
<div id="l2c2" class="cap clip" data-start="162.27" data-duration="0.893" data-track-index="1"><span>until this time.</span></div>
<div id="l4c0" class="cap clip" data-start="163.383" data-duration="1.083" data-track-index="1"><span>If worker A crashes,</span></div>
<div id="l4c1" class="cap clip" data-start="164.466" data-duration="2.629" data-track-index="1"><span>ownership expires, and another worker can recover.</span></div>
<div id="l6c0" class="cap clip" data-start="167.315" data-duration="1.81" data-track-index="1"><span>The lease says who may process;</span></div>
<div id="l6c1" class="cap clip" data-start="169.125" data-duration="1.414" data-track-index="1"><span>Cosmos ETags enforce it,</span></div>
<div id="l6c2" class="cap clip" data-start="170.538" data-duration="1.696" data-track-index="1"><span>applying a change only if the</span></div>
<div id="l6c3" class="cap clip" data-start="172.235" data-duration="2.205" data-track-index="1"><span>record is unchanged since it was read.</span></div>
<div id="l7c0" class="cap clip" data-start="174.66" data-duration="0.942" data-track-index="1"><span>The cost: expiry,</span></div>
<div id="l7c1" class="cap clip" data-start="175.602" data-duration="2.301" data-track-index="1"><span>renewal and ownership checks must be right.</span></div>
<div id="r2c0" class="cap clip" data-start="178.453" data-duration="1.685" data-track-index="1"><span>Already completed? Acknowledge.</span></div>
<div id="r3c0" class="cap clip" data-start="180.358" data-duration="1.515" data-track-index="1"><span>Actively owned? Stay out.</span></div>
<div id="r4c0" class="cap clip" data-start="182.093" data-duration="1.322" data-track-index="1"><span>Expired? Recover.</span></div>
<div id="r5c0" class="cap clip" data-start="183.635" data-duration="2.027" data-track-index="1"><span>Temporary failure? Retry with backoff.</span></div>
<div id="r6c0" class="cap clip" data-start="185.882" data-duration="1.891" data-track-index="1"><span>Malformed or repeatedly failing?</span></div>
<div id="r6c1" class="cap clip" data-start="187.773" data-duration="1.949" data-track-index="1"><span>Dead-letter it for investigation.</span></div>
<div id="r7c0" class="cap clip" data-start="189.942" data-duration="1.248" data-track-index="1"><span>One window stays open:</span></div>
<div id="r7c1" class="cap clip" data-start="191.19" data-duration="1.736" data-track-index="1"><span>the provider accepts the email,</span></div>
<div id="r7c2" class="cap clip" data-start="192.926" data-duration="2.712" data-track-index="1"><span>then the worker crashes before recording success.</span></div>
<div id="r8c0" class="cap clip" data-start="195.858" data-duration="0.978" data-track-index="1"><span>So the design must</span></div>
<div id="r8c1" class="cap clip" data-start="196.836" data-duration="1.646" data-track-index="1"><span>not promise exactly-once email.</span></div>
<div id="c1c0" class="cap clip" data-start="199.032" data-duration="2.28" data-track-index="1"><span>These mechanisms improve failure handling,</span></div>
<div id="c1c1" class="cap clip" data-start="201.312" data-duration="1.325" data-track-index="1"><span>and they add complexity.</span></div>
<div id="c2c0" class="cap clip" data-start="202.857" data-duration="1.585" data-track-index="1"><span>Not every choice was required,</span></div>
<div id="c2c1" class="cap clip" data-start="204.442" data-duration="0.869" data-track-index="1"><span>or the simplest.</span></div>
<div id="c3c0" class="cap clip" data-start="205.531" data-duration="1.426" data-track-index="1"><span>Their value is being able to</span></div>
<div id="c3c1" class="cap clip" data-start="206.957" data-duration="1.377" data-track-index="1"><span>explain and demonstrate the</span></div>
<div id="c3c2" class="cap clip" data-start="208.335" data-duration="1.377" data-track-index="1"><span>failure each one addresses.</span></div>
</div>
