<style>#root{background:#f8f9ff}</style>
<div id="stage">
 <div class="title">Managed ingress</div><div class="sub">Let Azure handle the public HTTPS entry point</div>

  <path id="strike" d="M480 310L1250 390" stroke="#e5484d" stroke-width="12" stroke-linecap="round" pathLength="1" fill="none"/>
 </svg>
 <div class="txt" id="net" style="left:96px;top:420px;color:#494454">Internet</div>
 <div class="ticket" id="ticket" style="left:96px;top:580px">event-123</div>
 <div class="box" id="nginx" style="left:490px;top:280px;width:320px;height:110px">Nginx</div>
 <div class="box" id="le" style="left:840px;top:280px;width:400px;height:110px">Let’s Encrypt</div>
 <div class="box fill" id="aca" style="left:560px;top:290px;width:640px;height:96px">HTTPS + routing, built in</div>
 <div class="box" id="api" style="left:1180px;top:440px;width:644px;height:300px;align-content:start;justify-items:start;text-align:left;padding:28px 36px">Rust API</div>
 <div class="txt" id="k1" style="left:1224px;top:540px">✓ Auth0 token valid</div>
 <div class="txt" id="k2" style="left:1224px;top:620px">✓ Permissions checked</div>
 <div class="cost" id="cost"><b>Cost</b>Azure’s features and limits</div>
</div>
<script>
const s=2.05;H.head(tl,s);
H.pop(tl,"#wall1,#wall2",s+.1);H.slide(tl,"#net,#ticket",s+.25);
H.drop(tl,"#nginx",T.i4+.05);H.drop(tl,"#le",T.i4+.8);
H.draw(tl,"#strike",T.i4+4.4,.35);
tl.to("#nginx,#le",{y:760,rotation:12,opacity:0,duration:.6,ease:"power3.in",stagger:.08},T.i4+4.9);
tl.to("#strike",{opacity:0,duration:.15},T.i4+4.9);

H.slide(tl,"#api",T.i5-.1,70);
tl.to("#ticket",{x:610,duration:.5,ease:"power2.inOut"},T.i5-.2);
tl.to("#ticket",{x:770,duration:.3,ease:"power2.out"},T.i5+.3);
H.blur(tl,"#k1",T.i5+2.5);H.blur(tl,"#k2",T.i5+3.7);
H.slide(tl,"#cost",T.i6+.15,80);
H.whipOut(tl,D);
</script>
