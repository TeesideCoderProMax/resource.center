<style>#root{background:#2a1458;color:#fff}
.card{position:absolute;left:560px;top:290px;width:800px;height:380px;background:#fff;color:#0b1c30;border-radius:18px;padding:34px 44px;font-size:44px;font-weight:700;line-height:2}
.card span{font-family:"IBM Plex Mono",monospace;font-weight:600;color:#7c3aed}
.sw{display:inline-grid}.sw span{grid-area:1/1}
.wk{position:absolute;top:400px;width:380px;height:150px;border:6px solid #fff;border-radius:14px;display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:42px;font-weight:700}
</style>
<div id="stage" class="dark">
 <div class="title">Notification leases</div><div class="sub">Stop two workers processing the same job simultaneously</div>
 <div class="wk" id="wa" style="left:96px;background:#7c3aed">worker-A</div>
 <div class="wk" id="wb" style="left:1444px">worker-B</div>
 <div class="card" id="card">Job: <span>event-123</span><br>Owner: <span class="sw"><span id="o1">worker-A</span><span id="o2">worker-B</span></span><br>Expires: <span>14:05</span></div>
 <svg class="full" viewBox="0 0 1920 1080"><path id="block" d="M1400 420l-70 90M1330 420l70 90" fill="none" stroke="#e5484d" stroke-width="12" stroke-linecap="round" pathLength="1"/>
 <path id="bolt" class="bolt" d="M500 280l-110 170h80l-90 140 200-190h-84l90-120z"/></svg>
 <div class="txt" id="e1" style="left:300px;top:720px">Lease: who may process</div>
 <div class="txt" id="e2" style="left:1000px;top:720px;color:#a7f3d0">ETag: enforces it</div>
 <div class="cost" id="cost" style="top:810px"><b>Cost</b>Expiry, renewal, ownership checks</div>
</div>
<script>
const s=.25;H.whipIn(tl);H.head(tl,s);
H.slide(tl,"#wa",T.l1+.5);H.slide(tl,"#wb",T.l1+1.1,70);
H.pop(tl,"#card",T.l2+.3);H.draw(tl,"#block",T.l2+2.9,.3);
H.stamp(tl,"#bolt",T.l4+.5);tl.to("#wa",{opacity:.3,duration:.2},T.l4+.7);
tl.to("#block",{opacity:0,duration:.15},T.l4+2);
tl.to("#o1",{opacity:0,y:-20,duration:.15},T.l4+2.2);tl.fromTo("#o2",{opacity:0,y:20},{opacity:1,y:0,duration:.2},T.l4+2.3);
tl.to("#wb",{backgroundColor:"#7c3aed",duration:.2},T.l4+2.3);
H.blur(tl,"#e1",T.l6+.2);H.blur(tl,"#e2",T.l6+2.2);
H.slide(tl,"#cost",T.l7+.15,80);
H.whipOut(tl,D);
</script>
