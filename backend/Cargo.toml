[workspace]
resolver = "2"
members = [
    "crates/rc-shared",
    "crates/loan-service",
    "crates/notifications-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
axum = { version = "=0.8.4", features = ["json"] }
tokio = { version = "=1.44.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tower = { version = "=0.5.2" }
tower-http = { version = "=0.6.2", features = ["cors", "trace"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
reqwest = { version = "=0.12.15", default-features = false, features = ["json", "rustls-tls"] }
tokio-postgres = { version = "=0.7.13", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
postgres-native-tls = "=0.5.1"
native-tls = "=0.2.14"
chrono = { version = "=0.4.40", features = ["serde"] }
uuid = { version = "=1.16.0", features = ["v4", "v5", "serde"] }
jsonwebtoken = "=9.3.1"
urlencoding = "=2.1.3"
thiserror = "=2.0.12"
async-trait = "=0.1.88"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["json", "env-filter"] }
