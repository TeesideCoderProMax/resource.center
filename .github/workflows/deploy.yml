name: Deploy & Promote
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      target_environment:
        description: Target environment
        required: true
        default: test
        type: choice
        options: [test, staging, production]
      test_run_id:
        description: Successful dev push Test release run ID (promotion only)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.target_environment || 'test' }}
  cancel-in-progress: false
jobs:
  verify:
    timeout-minutes: 30
    # Test deploys only from dev (also enforced by the test environment branch policy);
    # staging/production promotions are dispatched from main.
    if: >-
      (github.ref == 'refs/heads/dev' && (github.event_name == 'push' || inputs.target_environment == 'test'))
      || (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.target_environment != 'test')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"
      - run: npm --prefix frontend ci
      - name: All checks including real PostgreSQL
        shell: bash
        run: |
          set -o pipefail
          make check backend-test-postgres 2>&1 | tee checks.log
      - name: Test outcome
        if: always()
        run: echo 'Verification result is recorded in checks.log; skipped checks are not passes.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: checks.log
  release:
    timeout-minutes: 45
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment || 'test' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      TARGET_ENV: ${{ inputs.target_environment || 'test' }}
      TEST_RUN_ID: ${{ inputs.test_run_id }}
      GH_TOKEN: ${{ github.token }}
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_SERVER: ${{ vars.ACR_SERVER }}
      TF_VAR_service_version: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual promotion rules and tested release
        if: env.TARGET_ENV != 'test'
        run: python3 infra/scripts/promotion.py "$TARGET_ENV" "$TEST_RUN_ID"
      - name: Load reviewed environment configuration
        env:
          WORKLOADS_TFVARS: ${{ vars.WORKLOADS_TFVARS }}
          WORKLOADS_BACKEND_HCL: ${{ vars.WORKLOADS_BACKEND_HCL }}
        run: |
          test -n "$WORKLOADS_TFVARS" && test -n "$WORKLOADS_BACKEND_HCL"
          test -n "$ARM_CLIENT_ID" && test -n "$ARM_TENANT_ID" && test -n "$ARM_SUBSCRIPTION_ID"
          printf '%s\n' "$WORKLOADS_TFVARS" > "infra/environments/$TARGET_ENV/workloads.tfvars"
          printf '%s\n' "$WORKLOADS_BACKEND_HCL" > "infra/environments/$TARGET_ENV/workloads.backend.hcl"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
      - name: Build Test images once
        if: env.TARGET_ENV == 'test'
        run: |
          set -euo pipefail
          test -n "$ACR_NAME" && test -n "$ACR_SERVER"
          az acr login --name "$ACR_NAME"
          for component in backend web; do
            context=backend
            if [[ "$component" == web ]]; then context=frontend; fi
            image="$ACR_SERVER/rc-$component:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$image" "$context"
            docker tag "$image" "rc-$component:ci"
            docker push "$image"
            digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image")
            echo "TF_VAR_${component}_image=$digest" >> "$GITHUB_ENV"
          done
          # Test the same images before any target migration or app activation.
          make image-test
      - name: Copy verified digests to isolated target registry
        if: env.TARGET_ENV != 'test'
        run: |
          set -euo pipefail
          test -n "$ACR_NAME" && test -n "$ACR_SERVER"
          for component in backend web; do
            key="TF_VAR_${component}_image"
            source="${!key}"
            digest="${source##*@}"
            tag="rc-$component:$TF_VAR_service_version"
            az acr import --name "$ACR_NAME" --source "$source" --image "$tag" --force
            actual=$(az acr repository show --name "$ACR_NAME" --image "$tag" --query digest -o tsv)
            test "$actual" = "$digest"
            echo "${key}=$ACR_SERVER/rc-$component@$digest" >> "$GITHUB_ENV"
          done
      - name: Drain, migrate and seed, activate, then smoke
        run: python3 infra/scripts/release.py "$TARGET_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET_ENV }}-release
          path: release.json
          if-no-files-found: error
      - name: Release identity
        run: cat release.json >> "$GITHUB_STEP_SUMMARY"
